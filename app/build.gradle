plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sachin.niftyoptionai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sachin.niftyoptionai'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '9Tab-1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
