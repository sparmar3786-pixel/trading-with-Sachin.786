name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - same-code-apk-ready

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify preserved source
        working-directory: android_app
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sachin/niftyoptionai/MainActivity.java
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/assets/index.html
          grep -q 'loadUrl("file:///android_asset/index.html")' app/src/main/java/com/sachin/niftyoptionai/MainActivity.java
          echo "Java + HTML source verified"

      - name: Build debug APK
        working-directory: android_app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android_app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-with-Sachin-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
