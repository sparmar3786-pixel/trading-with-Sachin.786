name: Build Sp786 Option Chain Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - Sp786

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare bundled HTML
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/option-chain-analyzer.html
          test -s app/src/main/assets/option-chain-analyzer.html

      - name: Verify project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sachin/sp786optionchain/MainActivity.kt
          test -s app/src/main/assets/option-chain-analyzer.html
          echo "Sp786 project OK"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk
          ls -lh app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sp786-Option-Chain-Analyzer-apk
          path: app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk
