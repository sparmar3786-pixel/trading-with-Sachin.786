name: Build Sp786 Option Chain Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - Sp786

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare bundled HTML
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/option-chain-analyzer.html
          test -s app/src/main/assets/option-chain-analyzer.html

      - name: Verify project and analyzer core
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sachin/sp786optionchain/MainActivity.kt
          test -s app/src/main/assets/option-chain-analyzer.html
          grep -q "function parseCSV" app/src/main/assets/option-chain-analyzer.html
          grep -q "function runAnalysis" app/src/main/assets/option-chain-analyzer.html
          grep -q "function classify" app/src/main/assets/option-chain-analyzer.html
          echo "Sp786 project + analyzer core verified"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "com.sachin.sp786optionchain"
          sha256sum "$APK"

      - name: Rename APK
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk
          test -s app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk
          ls -lh app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sp786-Option-Chain-Analyzer-apk
          path: app/build/outputs/apk/debug/Sp786-Option-Chain-Analyzer.apk
