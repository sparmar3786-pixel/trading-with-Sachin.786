name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Gradle files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== SETTINGS ==="
          cat settings.gradle
          echo "=== ROOT BUILD ==="
          cat build.gradle
          echo "=== APP BUILD ==="
          cat app/build.gradle

      - name: Build APK
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --info

      - name: Check APK
        if: success()
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
