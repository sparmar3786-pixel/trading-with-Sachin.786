name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Python market-data connectors
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m py_compile server.py data_source.py groww.py dhan.py broker_secrets.py failover.py
          python3 test_connectors.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare Android project files
        run: |
          mkdir -p app/src/main
          test -f app/src/main/AndroidManifest.xml
          test -f index.html
          echo "Using repository Android shell and frontend"

      - name: Create missing Android source files
        run: |
          mkdir -p app/src/main/java/com/sachin/niftyoptionai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > app/src/main/java/com/sachin/niftyoptionai/MainActivity.java <<'EOF'
          package com.sachin.niftyoptionai;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;
          import android.webkit.JavascriptInterface;
          import android.net.Uri;
          import android.content.Intent;
          import android.database.Cursor;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setSupportMultipleWindows(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  web.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  }
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          try {
                              Intent intent = params.createIntent();
                              intent.setType("*/*");
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              private final class AndroidBridge {
                  @JavascriptInterface
                  public void openExternal(String url) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception e) {
                          android.util.Log.e("NIFTY_OPTION_AI", "External link failed", e);
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          if (uri != null) results = new Uri[]{uri};
                          else results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      }
                      filePathCallback.onReceiveValue(results);
                      if (results != null && results.length > 0) saveSelectedFile(results[0]);
                      filePathCallback = null;
                  }
              }

              private String selectedDisplayName(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, new String[]{"_display_name"}, null, null, null);
                      if (c != null && c.moveToFirst()) return c.getString(0);
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return "option_chain.csv";
              }

              private void saveSelectedFile(Uri uri) {
                  try {
                      String original = selectedDisplayName(uri);
                      String base = original.replaceAll("[^A-Za-z0-9._-]", "_");
                      String stamp = new SimpleDateFormat("yyyy-MM-dd_HH-mm-ss", Locale.US).format(new Date());
                      String fileName = stamp + "_" + base;
                      String mime = getContentResolver().getType(uri);
                      if (mime == null) mime = "application/octet-stream";

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          android.content.ContentValues values = new android.content.ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mime);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/NIFTY Option AI");
                          Uri out = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (out == null) return;
                          try (InputStream in = getContentResolver().openInputStream(uri);
                               java.io.OutputStream os = getContentResolver().openOutputStream(out)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while (in != null && os != null && (n = in.read(buf)) > 0) os.write(buf, 0, n);
                          }
                      } else {
                          File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "NIFTY Option AI");
                          if (!dir.exists()) dir.mkdirs();
                          File out = new File(dir, fileName);
                          try (InputStream in = getContentResolver().openInputStream(uri);
                               FileOutputStream os = new FileOutputStream(out)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while (in != null && (n = in.read(buf)) > 0) os.write(buf, 0, n);
                          }
                      }
                  } catch (Exception e) {
                      android.util.Log.e("NIFTY_OPTION_AI", "File backup failed", e);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#71a7ff</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#08101d</item>
                  <item name="android:statusBarColor">#08101d</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cp index.html app/src/main/assets/index.html

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sachin/niftyoptionai/MainActivity.java
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/assets/index.html
          echo "Android project structure OK"
          find app/src/main -maxdepth 4 -type f | sort

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Trading-with-Sachin.apk
          ls -lh app/build/outputs/apk/debug/Trading-with-Sachin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-with-Sachin-apk
          path: app/build/outputs/apk/debug/Trading-with-Sachin.apk
