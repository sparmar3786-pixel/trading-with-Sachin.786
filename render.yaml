services:
  - type: web
    name: nifty-option-ai-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: REQUIRE_HTTPS
        value: "1"
      - key: PYTHON_VERSION
        value: 3.13.5
